name: sosumi
description: "Unofficial Apple Music client for Linux — native, single-process, Liquid Glass."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # The Rust core. Version-locked to the codegen output in lib/rust.
  flutter_rust_bridge: 2.13.0

  # State. Riverpod gives compile-time-safe dependency injection and works well
  # with an opaque Rust handle behind a provider.
  flutter_riverpod: ^2.6.1

  # Word-timed lyrics rendering with an Apple Music preset.
  flutter_lyric: ^4.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
