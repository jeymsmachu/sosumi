[package]
name = "sosumi-core"
description = "Platform-neutral core for sosumi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "sosumi_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
base64 = "0.23.1"
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
