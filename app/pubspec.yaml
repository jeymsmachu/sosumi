name: sosumi
description: "Cross-platform Apple Music client UI."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  liquid_glass_widgets: ^1.16.1
  sosumi_core:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
