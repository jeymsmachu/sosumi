name: release-build

# Manual only. CI on push never builds release artifacts.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label used in artifact names
        required: true
        default: '0.1.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: release · android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - working-directory: app
        run: flutter pub get

      - name: Build Android release APK
        working-directory: app
        run: flutter build apk --release --no-pub

      - uses: actions/upload-artifact@v7
        with:
          name: sosumi-${{ inputs.version }}-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  linux:
    name: release · linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libblkid-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - working-directory: app
        run: flutter pub get

      - run: flutter config --enable-linux-desktop

      - name: Build Linux release bundle
        working-directory: app
        run: flutter build linux --release --no-pub

      - name: Archive Linux bundle
        run: |
          tar -czf "sosumi-${{ inputs.version }}-linux-x64.tar.gz" \
            -C app/build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v7
        with:
          name: sosumi-${{ inputs.version }}-linux
          path: sosumi-${{ inputs.version }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: release · windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - working-directory: app
        run: flutter pub get

      - run: flutter config --enable-windows-desktop

      - name: Build Windows release bundle
        working-directory: app
        run: flutter build windows --release --no-pub

      - name: Archive Windows bundle
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'app/build/windows/x64/runner/Release/*' `
            -DestinationPath 'sosumi-${{ inputs.version }}-windows-x64.zip' `
            -Force

      - uses: actions/upload-artifact@v7
        with:
          name: sosumi-${{ inputs.version }}-windows
          path: sosumi-${{ inputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  apple:
    name: release · macOS + iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - working-directory: app
        run: flutter pub get

      - run: flutter config --enable-macos-desktop

      - name: Build macOS release bundle
        working-directory: app
        run: flutter build macos --release --no-pub

      - name: Archive macOS bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            app/build/macos/Build/Products/Release/sosumi.app \
            "sosumi-${{ inputs.version }}-macos.zip"

      - name: Build iOS release app (unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Archive iOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            app/build/ios/iphoneos/Runner.app \
            "sosumi-${{ inputs.version }}-ios-unsigned.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: sosumi-${{ inputs.version }}-macos
          path: sosumi-${{ inputs.version }}-macos.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: sosumi-${{ inputs.version }}-ios
          path: sosumi-${{ inputs.version }}-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 7
