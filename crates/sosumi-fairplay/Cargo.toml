[package]
name = "sosumi-fairplay"
description = "Apple ID sign-in and lossless audio keys, through Apple's own FairPlay libraries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The crate ships a vendored C/C++ library, so it is not published to crates.io:
# the build script compiles sources that are not part of a normal Rust package.
publish = false

[lints]
# This is the one crate that relaxes the workspace's `forbid(unsafe_code)`.
# The relaxation is scoped to the FFI surface in `src/ffi.rs` and to nothing
# else; see the crate docs for why the boundary is here and how it is kept small.
workspace = true

[dependencies]
sosumi-diagnostics.workspace = true
hex.workspace = true
sha2.workspace = true
toml.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile.workspace = true
