[package]
name = "sosumi-cli"
description = "A command-line harness for exercising the Sosumi core without the UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "sosumi"
path = "src/main.rs"

[dependencies]
sosumi-audio.workspace = true
sosumi-core.workspace = true
sosumi-diagnostics.workspace = true
sosumi-discord.workspace = true
sosumi-linux.workspace = true
sosumi-metadata.workspace = true
sosumi-provider-api.workspace = true
sosumi-provider-apple.workspace = true
sosumi-provider-local.workspace = true
sosumi-security.workspace = true
sosumi-spatial.workspace = true
sosumi-storage.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tracing.workspace = true
