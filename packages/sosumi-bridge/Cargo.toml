crate-type = ["cdylib", "staticlib", "rlib"]

[lints]
workspace = true

[dependencies]
sosumi-core.workspace = true
sosumi-diagnostics.workspace = true
sosumi-provider-api.workspace = true
sosumi-security.workspace = true
sosumi-storage.workspace = true
anyhow.workspace = true
flutter_rust_bridge = "=2.13.0"
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true
